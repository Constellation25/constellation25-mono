version: '3.8'

services:
  videocourts-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./database.sqlite3
      - REDIS_URL=redis://redis:6379
      - MANUS_ENVIRONMENT=true
      - CLOUD_IDE_URL=${MANUS_URL}
    volumes:
      - ./backend:/app
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - videocourts-network

  videocourts-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://videocourts-backend:8000
      - REACT_APP_MANUS_URL=${MANUS_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    depends_on:
      - videocourts-backend
    networks:
      - videocourts-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - videocourts-network

  manus-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-manus.conf:/etc/nginx/nginx.conf
    depends_on:
      - videocourts-backend
      - videocourts-frontend
    networks:
      - videocourts-network

networks:
  videocourts-network:
    driver: bridge
